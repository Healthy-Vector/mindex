name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mindex
          POSTGRES_PASSWORD: mindex_ci
          POSTGRES_DB: mindex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindex"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # sql/init/ 전체를 파일명 순으로 실행한다 (D-10에서 7개로 분할 예정).
      # 파일 하나만 지정하면 새로 추가한 .sql이 조용히 건너뛰어진다.
      # ON_ERROR_STOP=1이 없으면 문 단위 에러가 나도 psql이 exit 0을 반환해 CI가 초록이 된다.
      - name: Load schema (sql/init/*.sql)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sql/init/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::sql/init/ 에 .sql 파일이 없다"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 "postgresql://mindex:mindex_ci@localhost:5432/mindex" -f "$f"
          done
        env:
          PGPASSWORD: mindex_ci
      - run: ruff check .
      - run: pytest -v
        env:
          DATABASE_URL: postgresql+psycopg2://mindex:mindex_ci@localhost:5432/mindex

  # SER-008 의존성 취약점 점검 — COR 라이선스 검증과 병행
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
