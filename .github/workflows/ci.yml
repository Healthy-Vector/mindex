name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mindex
          POSTGRES_PASSWORD: mindex_ci
          POSTGRES_DB: mindex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindex"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: psql "postgresql://mindex:mindex_ci@localhost:5432/mindex" -f sql/init/01_schema.sql
        env:
          PGPASSWORD: mindex_ci
      - run: ruff check .
      - run: pytest -v
        env:
          DATABASE_URL: postgresql+psycopg2://mindex:mindex_ci@localhost:5432/mindex

  # SER-008 의존성 취약점 점검 — COR 라이선스 검증과 병행
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build
