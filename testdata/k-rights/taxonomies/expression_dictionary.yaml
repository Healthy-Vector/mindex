      EN: [for N years from the Effective Date]
      JP: [発効日からN年間]
    RELEASE_DATE_PLUS_DURATION:
      KO: [공개일로부터 N일간, 공개일 다음 날부터 N일간]
      EN: [for N days from release, for N days after release]
      JP: [公開日からN日間, 公開日の翌日からN日間]
    HOLD_BACK_DURATION:
      KO: [종료일로부터 N일간 이용하지 않는다]
      EN: [shall not exploit for N days following expiration]
      JP: [終了日からN日間利用しない]

period_normalization:
  granularity: DAY
  interval_model: CLOSED
  fixed_range: Explicit start and end dates are inclusive unless the text states otherwise.
  duration_from_anchor: Start on the anchor date; an N-day term ends N-1 days later, while N-month or N-year terms end the day before the corresponding anniversary.
  wording_after_anchor: Start on the day after the anchor date.
  boundary_overlap: Adjacent periods do not overlap when the later period starts the day after the earlier inclusive end date.
  ambiguity_rule: If wording does not determine the anchor or inclusion convention, keep the normalized period UNRESOLVED.
