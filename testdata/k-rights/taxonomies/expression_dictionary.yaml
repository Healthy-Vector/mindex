status: REVIEWED
version: 0.3
phase: C
languages: [KO, EN, JP]

field_status_values:
  PRESENT_EXPLICIT: The value is directly stated in the contract text or an incorporated schedule.
  PRESENT_DERIVED: The value is deterministically calculated from explicit text under a reviewed rule.
  UNRESOLVED: Relevant wording exists but does not support a single canonical value.
  ABSENT: The document contains no evidence for the field; this is not a negative fact such as non-consent.
  EXTERNAL_REFERENCE: The value is delegated to another document that is not part of the evaluated evidence set.

normalization_policy:
  preserve_raw_expression: true
  canonical_value_required_for_comparison: true
  no_keyword_default:
    exclusivity: UNRESOLVED
    territory: UNRESOLVED
    exploitation_mode: UNRESOLVED
  external_document_rule: Do not infer the referenced value unless the incorporated document is available in the evidence set.

