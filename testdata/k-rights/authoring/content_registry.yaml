status: REVIEWED
version: 0.4
phase: C
naming_policy:
  status: REVIEWED
  basis: Popular Korean drama and film title conventions using emotion, time and place motifs.
  restriction: Titles are original synthetic names and must not imply identity with a real work.
content_types:
  DRAMA:
    definition: Episodic audiovisual dramatic work.
  FILM:
    definition: Feature-length or standalone audiovisual work.
content_scope_levels:
  SERIES:
    parent: null
    definition: The complete series as a content scope.
  SEASON:
    parent: SERIES
    definition: A season within a series.
  EPISODE:
    parent: SEASON
    definition: An individual episode within a season.
  EDIT:
    parent_scope_required: true
    definition: A language, censorship, airline, director or other contractual edit of a registered work scope.
  MANIFESTATION:
    parent_scope_required: true
    definition: A specifically delivered file or physical embodiment.
scope_policy:
  default_scope: UNRESOLVED
  registration_rule: Scenario metadata must identify the exact scope; content type alone does not determine Series, Season, Episode or Edit.
  manifestation_rule: Use MANIFESTATION only when the contract identifies a particular delivered embodiment.
  non_merger_rule: A remake, OST or other related work does not inherit the parent audiovisual content_id.
