status: REVIEWED
version: 0.5
phase: B

# Phase B records document relationships only. RightsGrant values, parties,
# territory and period values are fixed in later phases.
summary:
  scenario_count: 72
  target_contract_count: 72
  supporting_contract_count: 14
  unique_contract_count: 86
  unique_contracts_by_language:
    KO: 29
    EN: 29
    JP: 28

id_policy:
  target_contracts: "CTR-{LANG}-0001..0024 in source scenario order"
  supporting_contracts: "CTR-{LANG}-9001.. for contracts not targeted by another scenario"
  reuse_rule: "A target contract may be reused as an EXISTING contract by later scenarios."

vocabularies:
  scenario_role:
    TARGET: Contract currently being evaluated in the Scenario.
    EXISTING: Previously registered contract compared with the Target.
    UPSTREAM: Contract from which the Target grantor derives its authority.
  agreement_type:
    DIRECT_LICENSE: Direct permission from a rights owner or other direct grantor.
    SUBLICENSE: Downstream permission granted under authority received from an upstream agreement.
    ASSIGNMENT: Transfer of ownership in all or part of the relevant rights.
    AMENDMENT: Document modifying an existing agreement rather than creating a standalone grant.
    UNRESOLVED: Agreement type cannot be determined from the available metadata.

# agreement_type belongs to the Contract and does not change when the same
# Contract is TARGET in one Scenario and EXISTING in another.
contract_metadata:
  default:
    agreement_type: DIRECT_LICENSE
  overrides:
    CTR-JP-0005: {agreement_type: SUBLICENSE}
    CTR-KO-0015: {agreement_type: SUBLICENSE}
    CTR-KO-0016: {agreement_type: SUBLICENSE}
    CTR-EN-0016: {agreement_type: SUBLICENSE}
    CTR-EN-0017: {agreement_type: SUBLICENSE}
    CTR-EN-0020: {agreement_type: SUBLICENSE}
    CTR-EN-0023: {agreement_type: SUBLICENSE}

review_items:
  - review_id: GRAPH-REVIEW-001
    status: REVIEWED
    topic: robustness_normal_hard_negative_mapping
    resolution: >-
      RB-KO01 -> KO-B01, RB-EN01 -> JP-B02 and RB-JP02 -> EN-B01 are approved
      as NORMAL hard negatives. See the Phase B Decision Note and Scenario
      Revision Notes for expected-result semantics.
  - review_id: GRAPH-REVIEW-002
    status: REVIEWED
    topic: shared_contract_scope_constraints
    resolution: >-
      Controlled Contract reuse is retained. Shared scope constraints are
      validation invariants for later metadata, while C007-C012 diversify six
      standalone Scenario families without changing the 86-Contract graph.
      Dataset splits must be grouped by Contract/Content family.

