  expected_result: [NORMAL, CONFLICT, REVIEW_REQUIRED, WARNING]
  scope_expectation: [BASELINE_NO_COMPARISON, NO_OVERLAP, AUTHORIZED_NO_CONFLICT, FULL_OVERLAP, PARTIAL_OVERLAP, AUTHORITY_EXCEEDED, MULTI_FINDING, UNRESOLVED, WARNING_ONLY]
  content_relationship: [NOT_APPLICABLE, SAME_CONTENT, DIFFERENT_CONTENT, DISJOINT_SCOPE_SAME_CONTENT, RELATED_ASSET_OF, DERIVATIVE_RIGHT_ON_SAME_PARENT, SAME_AS_UPSTREAM, UNRESOLVED_IDENTITY, THIRD_PARTY_RELATED_RIGHT]

rule_evidence_defaults:
  R1: [CONTENT]
  R2: [CONTENT, CARVE_OUT]
  R3: [LEGAL_RIGHT]
  R4: [EXPLOITATION_MODE]
  R5: [TERRITORY, CARVE_OUT]
  R6: [LICENSE_PERIOD]
  R7: [EXCLUSIVITY, RESERVED_RIGHTS, CARVE_OUT, HOLDBACK]
  R8: [LICENSE_GRANT, SUBLICENSE, ASSIGNMENT, NON_TRANSFERABLE]
  R9: [DERIVED_RIGHTS, RELATED_ASSET]

reason_codes:
  VALID_BASELINE_GRANT: No compared contract creates a conflict under the selected scope.
  EDIT_SCOPE_SEPARATE: Contractually identified edits do not overlap.
  RELATED_ASSET_SCOPE_SEPARATE: Audiovisual and related-asset grants remain legally distinct.
  DERIVATIVE_RIGHT_AVAILABLE: The relevant derivative right is expressly reserved and available.
  AUTHORIZED_SUBLICENSE: The target sublicense remains within reviewed upstream authority.
  TERRITORY_DISJOINT: Compared territory sets have no intersection.
  EXPLOITATION_MODE_DISJOINT: Compared exploitation modes do not overlap.
  PERIOD_ADJACENT_NO_OVERLAP: The target starts after the existing inclusive end date.
  NONEXCLUSIVE_COMPATIBLE: The compared non-exclusive grants can coexist.
  CONTENT_IDENTITY_DISTINCT: Compared canonical contents are different.
  CONTENT_SCOPE_DISJOINT: Compared season, episode or edit scopes do not overlap.
  TERRITORY_EXPLICITLY_EXCLUDED: An express territory carve-out removes the overlap.
  EXCLUSIVE_RIGHT_OVERLAP: An exclusive grant is incompatible with another grant in the overlapping scope.
  PARTIAL_TERRITORY_OVERLAP: Only part of the target territory intersects the existing grant.
  CONTENT_SCOPE_OVERLAP: A series, season, episode or edit hierarchy creates overlap.
  PARTIAL_GRANT_OVERLAP: Only one or some RightsGrants in a contract conflict.
  AUTHORITY_SCOPE_EXCEEDED: The target grant exceeds upstream right, mode or territory authority.
  AUTHORITY_PERIOD_EXCEEDED: The target grant exceeds the upstream licence period.
  UNAUTHORIZED_SUBLICENSE: The document itself proves that the sublicense is outside permitted recipients or conditions.
  DERIVATIVE_RIGHT_OVERLAP: The same derivative right is already granted in the relevant scope.
  RELATED_ASSET_RIGHT_OVERLAP: A related music asset right overlaps while the audiovisual scope may remain separate.
  HOLDBACK_VIOLATION: Exploitation starts before an operative holdback expires.
  TERRITORY_UNRESOLVED: An unavailable territory definition prevents deterministic comparison.
  PERIOD_UNRESOLVED: A missing date anchor prevents deterministic period calculation.
  EXCLUSIVITY_UNRESOLVED: The operative wording does not determine exclusivity.
  CONTENT_IDENTITY_UNRESOLVED: Available identifiers do not establish whether two titles are the same content.
  SUBLICENSE_CONSENT_UNVERIFIED: Required consent is an unavailable external document and approval status cannot be inferred.
  DERIVATIVE_SCOPE_UNRESOLVED: Generic secondary-use wording does not determine the derivative-right scope.
  CROSS_BORDER_MUSIC_CLEARANCE: Third-party music clearance requires operational review before distribution.
  PRIOR_NEGOTIATION_OBLIGATION: A negotiation priority must be checked although no current rights conflict is established.

