<title id="erd-title">pdf_cache DB ERD</title><desc id="erd-desc">pdf_cache가 캐시한 PDF 한 건마다 contract_extraction 한 건이 연결되고, contract_extraction 아래로 party·rights_grant·payment·evidence가 1:N으로 딸린다. 각 관계선은 자식 테이블 색으로 구분된다.</desc>

