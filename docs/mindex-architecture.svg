  <rect x="560" y="378" width="360" height="76" rx="7" fill="#FFFFFF" stroke="#A9C1EC"/>
  <text class="ct" x="578" y="399">질의 · 구성</text>
  <text class="ci" x="578" y="420">SFR-009-P 후보 축소 필터</text>
  <text class="ci" x="578" y="440">SFR-015-P 구성 · SFR-012 · 013 · 016</text>

  <rect x="560" y="466" width="360" height="96" rx="7" fill="#FFFFFF" stroke="#A9C1EC"/>
  <text class="ct" x="578" y="487">스키마 · 저장 매핑</text>
  <text class="ci" x="578" y="508">DAR-001 권리 레코드 스키마</text>
  <text class="ci" x="578" y="528">WORLDWIDE 전개 · territory 행 분리</text>
  <text class="ci" x="578" y="548">SFR-010 change_log 워커</text>

  <line x1="942" y1="300" x2="1016" y2="300" stroke="#8A6D3B" stroke-width="2" marker-end="url(#ar-brown)"/>
