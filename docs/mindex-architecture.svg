  <rect x="235" y="510" width="165" height="42" rx="7" fill="#FFFFFF" stroke="#9CCFC1"/>
  <text class="pid" x="251" y="529">SFR-015-C</text>
  <text class="pnm" x="251" y="545">오케스트레이션 엔진</text>

  <rect x="235" y="560" width="165" height="42" rx="7" fill="#FFFFFF" stroke="#9CCFC1"/>
  <text class="pid" x="251" y="579">SFR-009-C</text>
  <text class="pnm" x="251" y="595">벡터 유사도 랭킹</text>

