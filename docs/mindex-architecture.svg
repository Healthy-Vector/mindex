  <rect x="1040" y="202" width="220" height="146" rx="7" fill="#FFFFFF" stroke="#D6C6A8"/>
  <text class="ct" x="1058" y="223">OpenSQL</text>
  <text class="ci" x="1058" y="246">DAR-001 테이블</text>
  <text class="ci" x="1058" y="268">SFR-007 EXCLUDE 제약</text>
  <text class="ci" x="1058" y="290">SER-002 RLS 격리</text>
  <text class="ci" x="1058" y="312">SER-006 ARIA · SEED</text>
  <text class="ci" x="1058" y="334">SER-001 4차 방어</text>

  <rect x="1040" y="360" width="220" height="44" rx="7" fill="#FFFFFF" stroke="#D6C6A8"/>
  <text class="ct" x="1058" y="380">OpenProxy</text>
  <text class="ci" x="1058" y="396">ECR-002 연결 중계</text>

  <rect x="1040" y="416" width="220" height="44" rx="7" fill="#FFFFFF" stroke="#D6C6A8"/>
  <text class="ct" x="1058" y="436">OpenBackup</text>
  <text class="ci" x="1058" y="452">ECR-003 · TER-005</text>

  <!-- 금지 -->
  <path d="M230,680 L230,718 L1150,718 L1150,524" fill="none" stroke="#B3261E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="700" cy="718" r="11" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.6"/>
  <line x1="694.5" y1="712.5" x2="705.5" y2="723.5" stroke="#B3261E" stroke-width="1.8"/>
  <line x1="705.5" y1="712.5" x2="694.5" y2="723.5" stroke="#B3261E" stroke-width="1.8"/>

  <!-- 범례 -->
  <rect x="40" y="760" width="1240" height="58" rx="8" fill="#FAFBFC" stroke="#CBD2D9"/>
  <text class="ct" x="60" y="782">범례</text>

  <rect x="120" y="772" width="14" height="14" rx="3" fill="#E9F5F1" stroke="#1F8A70"/>
  <text class="lg" x="142" y="784">core 패키지</text>

  <rect x="240" y="772" width="14" height="14" rx="3" fill="#EDF3FD" stroke="#3B6FD4"/>
  <text class="lg" x="262" y="784">플랫폼 패키지</text>

  <rect x="372" y="772" width="14" height="14" rx="3" fill="#F7F3EC" stroke="#8A6D3B"/>
  <text class="lg" x="394" y="784">인프라</text>

  <line x1="480" y1="779" x2="516" y2="779" stroke="#3B6FD4" stroke-width="1.8" marker-end="url(#ar-blue)"/>
  <text class="lg" x="524" y="784">호출</text>

  <line x1="580" y1="779" x2="616" y2="779" stroke="#1F8A70" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-teal)"/>
  <text class="lg" x="624" y="784">응답</text>

  <line x1="680" y1="779" x2="716" y2="779" stroke="#B3261E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="698" cy="779" r="7" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.4"/>
  <line x1="694.5" y1="775.5" x2="701.5" y2="782.5" stroke="#B3261E" stroke-width="1.4"/>
  <line x1="701.5" y1="775.5" x2="694.5" y2="782.5" stroke="#B3261E" stroke-width="1.4"/>
  <text class="lg" x="724" y="784">비접근</text>

  <text class="lg" x="120" y="806">SFR / SER / DAR / ECR / TER 는 SRS 요구사항 ID.  화살표 방향이 의존 방향이다.</text>
</svg>
