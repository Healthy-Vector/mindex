  <text class="pnm" x="76" y="407">0.85 검수 큐 · 0.70 폐기</text>

  <rect x="60" y="422" width="340" height="42" rx="7" fill="#FFFFFF" stroke="#9CCFC1"/>
  <text class="pid" x="76" y="441">SFR-005  임베딩 생성</text>
  <text class="pnm" x="76" y="457">로컬 구동 · 1024차원 HNSW</text>

  <line x1="230" y1="264" x2="230" y2="270" stroke="#1F8A70" stroke-width="1.5" marker-end="url(#ar-teal)"/>
  <line x1="230" y1="314" x2="230" y2="320" stroke="#1F8A70" stroke-width="1.5" marker-end="url(#ar-teal)"/>
  <line x1="230" y1="364" x2="230" y2="370" stroke="#1F8A70" stroke-width="1.5" marker-end="url(#ar-teal)"/>
  <line x1="230" y1="414" x2="230" y2="420" stroke="#1F8A70" stroke-width="1.5" marker-end="url(#ar-teal)"/>

