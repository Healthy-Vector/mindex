<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B6FD4"/>
    </marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F8A70"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B8794"/>
    </marker>
    <marker id="ar-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6D3B"/>
    </marker>
  </defs>

  <style>
    .t    { font-size:20px; font-weight:700; fill:#1F2933; }
    .lay  { font-size:15px; font-weight:700; }
    .grp  { font-size:11px; font-weight:700; fill:#7B8794; }
    .ct   { font-size:12px; font-weight:700; fill:#323F4B; }
    .ci   { font-size:10.5px; fill:#3E4C59; }
    .pid  { font-size:11.5px; font-weight:700; fill:#166B57; }
    .pnm  { font-size:10.5px; fill:#3E4C59; }
    .flow { font-size:9.5px; fill:#52606D; }
    .lg   { font-size:10.5px; fill:#3E4C59; }
  </style>

  <rect width="1320" height="860" fill="#FFFFFF"/>
  <text class="t" x="40" y="40">Mindex — 컴포넌트 다이어그램</text>

  <!-- 외부 -->
  <rect x="540" y="70" width="190" height="46" rx="8" fill="#F5F7FA" stroke="#CBD2D9"/>
  <text class="ct" x="558" y="90">브라우저 사용자</text>
  <text class="ci" x="558" y="107">조회 · 검색 · 업로드</text>

  <rect x="750" y="70" width="190" height="46" rx="8" fill="#F5F7FA" stroke="#CBD2D9"/>
  <text class="ct" x="768" y="90">외부 AI 도구</text>
  <text class="ci" x="768" y="107">MCP 클라이언트</text>

  <line x1="635" y1="116" x2="635" y2="156" stroke="#7B8794" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <line x1="845" y1="116" x2="845" y2="156" stroke="#7B8794" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <text class="flow" x="650" y="140">HTTP</text>
  <text class="flow" x="860" y="140">MCP</text>

  <!-- ================= core ================= -->
  <rect x="40" y="160" width="380" height="520" rx="12" fill="#E9F5F1" stroke="#1F8A70" stroke-width="1.8"/>
  <text class="lay" x="60" y="188" fill="#166B57">core</text>

  <text class="grp" x="60" y="212">흐름</text>

  <rect x="60" y="222" width="340" height="42" rx="7" fill="#FFFFFF" stroke="#9CCFC1"/>
  <text class="pid" x="76" y="241">SFR-001  파싱 · OCR</text>
  <text class="pnm" x="76" y="257">언어 감지 · 조항 단위 분할</text>

  <rect x="60" y="272" width="340" height="42" rx="7" fill="#FFFFFF" stroke="#9CCFC1"/>
  <text class="pid" x="76" y="291">SFR-002  구조화 추출</text>
