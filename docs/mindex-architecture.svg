  <text class="grp" x="60"  y="500">부품</text>
  <text class="grp" x="235" y="500">별도 진입점</text>

  <rect x="60" y="510" width="165" height="42" rx="7" fill="#F4FAF8" stroke="#BFDFD6"/>
