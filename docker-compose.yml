services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: mindex-db
    environment:
      POSTGRES_USER: ${DB_USER:-mindex}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mindex}
    ports:
      # 호스트에 PostgreSQL이 따로 설치돼 있으면 5432를 두 프로세스가 함께 물고
      # (Windows에서는 bind가 실패하지 않는다) 클라이언트가 엉뚱한 쪽에 붙는다.
      # 그 경우 .env에 DB_PORT=5433처럼 지정한다. 기본값은 종전과 같다.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
      - archive:/var/lib/postgresql/archive
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindex}"]
      interval: 5s
      retries: 10

  staging-db:
    image: postgres:17
    container_name: mindex-staging-db
    environment:
      POSTGRES_USER: ${STAGING_DB_USER:-mindex_staging}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_DB: ${STAGING_DB_NAME:-mindex_staging}
    ports:
      - "${STAGING_DB_PORT:-5434}:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./sql/staging_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_DB_USER:-mindex_staging}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  archive:
  staging_pgdata:
