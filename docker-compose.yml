services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: mindex-db
    environment:
      POSTGRES_USER: ${DB_USER:-mindex}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mindex}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
      - archive:/var/lib/postgresql/archive
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindex}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  archive:
